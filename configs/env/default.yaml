# Landing environment: gravity, timing, landing rules, flight limits, reward, and starting conditions.

gravity: 9.81       # [m/s²]
dt: 0.02            # control step [s], 50 Hz
substeps: 5         # Box2D steps per control step

landing:            # a touchdown is a safe landing only if all of these hold (judged just before contact)
  max_off_center: 0.5     # distance from the pad center [m]
  max_vx: 0.5             # horizontal speed [m/s]
  max_vy: 0.3             # vertical speed [m/s]: faster could break the legs
  max_tilt_deg: 5.0
  max_spin_deg_s: 5.0

limits:             # crossing one of these ends the episode
  max_x: 100.0            # |x| [m]
  max_altitude: 300.0     # [m]
  max_tilt_deg: 90.0      # past horizontal: lost control
  time_limit: 60.0        # [s]; stands in for running out of fuel, so it's a failure

reward:
  # Every step earns how much the landing score improved, where the landing score is
  # -(distance × distance_weight + speed × speed_weight + tilt × tilt_weight), so getting
  # closer to the pad, slower, and more upright all pay; minus the fuel and the time used.
  distance_weight: 1.0            # per m from the landing point
  speed_weight: 1.0               # per m/s
  tilt_weight: 10.0               # per rad (about 0.17 per degree)
  fuel_weight: 0.3                # per second of full main-engine thrust (side nozzles: by thrust)
  # Each second in the air costs time_weight, felt at once. Without it, hovering until the time
  # limit looks cheap: discounting (gamma) shrinks a penalty 40 s away to a seventh.
  time_weight: 1.0                # per second in the air
  # Once, at the end of the episode:
  landed_bonus: 100.0
  # An unsafe touchdown is graded, so a near miss costs little and a crash a lot: the base
  # penalty, plus penalty_per_limit_missed for each limit's worth of miss, summed over the
  # failed checks (0.4 m/s down with a 0.3 limit = 0.33). Never worse than lost_control_penalty.
  # Kept mild, so that touching down a bit too fast still beats hovering until the time limit:
  # at -10 per limit, any touchdown faster than about 0.6 m/s scored worse than hovering.
  unsafe_touchdown_penalty: -10.0
  penalty_per_limit_missed: -2.0
  lost_control_penalty: -100.0    # tilted past the limit, left the flight region, or body hit the ground
  time_limit_penalty: -100.0      # ran out of time (fuel): worse than any attempt to land

levels:             # starting conditions by difficulty (0 = easiest); each range is [min, max]
  - {altitude: [50, 80],   x: [-5, 5],   vx: [-1, 1],   vy: [-10, -5],  tilt_deg: [-3, 3],   spin_deg_s: [0, 0]}
  - {altitude: [50, 150],  x: [-20, 20], vx: [-5, 5],   vy: [-20, -5],  tilt_deg: [-10, 10], spin_deg_s: [-5, 5]}
  - {altitude: [100, 200], x: [-40, 40], vx: [-10, 10], vy: [-30, -10], tilt_deg: [-15, 15], spin_deg_s: [-10, 10]}
