# 100 kg rocket, in 2D.
#
# Positions are in the rocket's own frame, in meters: origin at the center of the base,
# +y up the rocket axis toward the nose, +x to the rocket's right when it stands upright.
# Box2D calculates the center of mass and moment of inertia from these shapes and masses.

body:            # a rectangle with its mass spread evenly
  height: 3.0
  width: 0.3
  mass: 80.0

engine_block:    # engine and legs: extra mass filling the bottom of the body
  height: 0.4
  mass: 20.0

# Order = order of the throttle commands [u1, u2, u3].
# direction = the way the force pushes the rocket (the exhaust goes the opposite way).
# A side nozzle is named after the side it is mounted on: "left" pushes the rocket right.
nozzles:
  - {name: main,  position: [0.0,   0.0], direction: [0.0,  1.0], max_thrust: 2000.0}
  - {name: left,  position: [-0.15, 2.7], direction: [1.0,  0.0], max_thrust: 25.0}
  - {name: right, position: [0.15,  2.7], direction: [-1.0, 0.0], max_thrust: 25.0}

# Legs: struts from the side of the body (top) down to the tip. The tips reach 0.2 m below
# the base, so the main nozzle stays clear of the ground when the rocket stands on its legs.
# Their mass is part of the engine block.
legs:
  - {top: [-0.15, 0.5], tip: [-0.6, -0.2]}
  - {top: [0.15,  0.5], tip: [0.6,  -0.2]}
