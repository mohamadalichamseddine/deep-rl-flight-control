# PPO training settings. The `ppo` block is passed to stable_baselines3.PPO as is.

total_steps: 5000000        # 20 ms control steps, summed over all rockets
parallel_rockets: 8         # rockets flying in parallel, one per CPU core
seed: 0

# Every validate_every steps, the current network (without exploration noise) flies the
# validation starts: separate from the test set, which stays untouched until the end.
validate_every: 250000
validation_episodes: 50

ppo:
  learning_rate: 1.0e-4     # smaller steps: at 3e-4, training found landing, then lost it again
  n_steps: 1024             # steps per rocket between network updates
  batch_size: 256
  n_epochs: 10
  # How much a reward counts per step it is away: a flight lasts up to 3000 steps. At 0.999,
  # the time-limit penalty 60 s ahead counted 5%, so hovering looked as good as landing
  # attempts; at 0.9995 it counts 22%.
  gamma: 0.9995
  gae_lambda: 0.98
  clip_range: 0.2
  ent_coef: 0.0
  policy_kwargs:            # our network (rocket_network.py): actor and critic layer sizes
    hidden_sizes: [64, 64]
